<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 184 184" role="img" aria-label="Creature Lab logo">
  <title>Creature Lab</title>
  <defs>
    <linearGradient id="cl-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ff3c"/>
      <stop offset="1" stop-color="#34e7e4"/>
    </linearGradient>
    <clipPath id="cl-flask"><path d="M86 44 V80 L48 146 Q42 164 62 164 H138 Q158 164 152 146 L114 80 V44 Z"/></clipPath>
  </defs>

  <!-- hexagon badge -->
  <polygon points="100,6 181.4,53 181.4,147 100,194 18.6,147 18.6,53" fill="#12233a" stroke="#b8ff3c" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="100,18 171,59 171,141 100,182 29,141 29,59" fill="none" stroke="#34e7e4" stroke-width="2" stroke-dasharray="6 6" opacity=".55"/>

  <!-- wings: feathered (left) + bat (right) -->
  <path d="M70 110 C52 94 28 96 16 108 C26 110 28 116 20 122 C30 123 32 129 26 135 C38 137 52 132 62 125 Z" fill="#ffa63d" stroke="#0a1420" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M130 110 C148 94 172 94 184 106 C176 108 174 114 178 120 C170 118 166 122 166 128 C158 124 150 126 140 128 Z" fill="#ff3dac" stroke="#0a1420" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- flask glass + liquid -->
  <path d="M86 44 V80 L48 146 Q42 164 62 164 H138 Q158 164 152 146 L114 80 V44 Z" fill="#e8f4ff" fill-opacity=".1"/>
  <g clip-path="url(#cl-flask)">
    <path d="M30 114 Q55 104 80 114 T130 114 T180 114 V180 H30 Z" fill="url(#cl-liquid)"/>
    <circle cx="66" cy="152" r="3.5" fill="#fff" opacity=".6"/>
    <circle cx="134" cy="144" r="2.5" fill="#fff" opacity=".6"/>
    <circle cx="128" cy="156" r="2" fill="#fff" opacity=".6"/>
  </g>
  <path d="M86 44 V80 L48 146 Q42 164 62 164 H138 Q158 164 152 146 L114 80 V44 Z" fill="none" stroke="#e8f4ff" stroke-width="5" stroke-linejoin="round"/>
  <rect x="78" y="34" width="44" height="11" rx="5" fill="#e8f4ff"/>
  <path d="M96 56 V74" stroke="#e8f4ff" stroke-width="3" stroke-linecap="round" opacity=".5"/>

  <!-- creature face in the liquid -->
  <circle cx="84" cy="134" r="10" fill="#fff" stroke="#0a1420" stroke-width="3"/>
  <circle cx="86" cy="135" r="5" fill="#0a1420"/>
  <circle cx="88" cy="132.5" r="1.6" fill="#fff"/>
  <ellipse cx="117" cy="134" rx="9" ry="10.5" fill="#ffd23f" stroke="#0a1420" stroke-width="3"/>
  <ellipse cx="117" cy="134.5" rx="2" ry="7.5" fill="#0a1420"/>
  <path d="M90 150 Q100 158 110 150" fill="none" stroke="#0a1420" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M102.5 153 L108.5 151.5 L106.5 158.5 Z" fill="#fff" stroke="#0a1420" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- bubbles -->
  <circle cx="100" cy="26" r="4.5" fill="#34e7e4"/>
  <circle cx="110" cy="17" r="3.5" fill="#b8ff3c"/>
  <circle cx="91" cy="19" r="2.5" fill="#ff3dac"/>

</svg>
