<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Unique Animal Generator logo">
  <title>Unique Animal Generator</title>
  <defs>
    <clipPath id="uag-left"><rect x="0" y="0" width="100" height="200"/></clipPath>
    <clipPath id="uag-right"><rect x="100" y="0" width="100" height="200"/></clipPath>
  </defs>
  <!-- starburst badge -->
  <polygon points="100.0,4.0 113.1,17.0 129.7,8.7 138.1,25.2 156.4,22.3 159.4,40.6 177.7,43.6 174.8,61.9 191.3,70.3 183.0,86.9 196.0,100.0 183.0,113.1 191.3,129.7 174.8,138.1 177.7,156.4 159.4,159.4 156.4,177.7 138.1,174.8 129.7,191.3 113.1,183.0 100.0,196.0 86.9,183.0 70.3,191.3 61.9,174.8 43.6,177.7 40.6,159.4 22.3,156.4 25.2,138.1 8.7,129.7 17.0,113.1 4.0,100.0 17.0,86.9 8.7,70.3 25.2,61.9 22.3,43.6 40.6,40.6 43.6,22.3 61.9,25.2 70.3,8.7 86.9,17.0" fill="#ffd23f" stroke="#2b1452" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="100" cy="100" r="72" fill="#19c3a6" stroke="#2b1452" stroke-width="4.5"/>

  <!-- cat ear (behind head) -->
  <path d="M104 72 Q128 50 147 44 Q148 72 142 100 Z" fill="#ff8f3a" stroke="#2b1452" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M116 72 Q131 60 140 56 Q141 72 138 88 Z" fill="#ff86bd"/>

  <!-- head: dog half (left) + cat half (right) -->
  <circle cx="100" cy="116" r="46" fill="#fff1dc" clip-path="url(#uag-left)"/>
  <circle cx="100" cy="116" r="46" fill="#ff8f3a" clip-path="url(#uag-right)"/>
  <ellipse cx="80" cy="108" rx="15" ry="14" fill="#d98c4a" clip-path="url(#uag-left)"/>
  <g stroke="#d9621a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M108 74 q4 7 0 13"/>
    <path d="M119 76 q4 7 0 12"/>
    <path d="M130 82 q3 6 0 10"/>
  </g>
  <circle cx="100" cy="116" r="46" fill="none" stroke="#2b1452" stroke-width="4.5"/>

  <!-- dog ear (floppy, in front) -->
  <path d="M88 72 C70 62 50 70 46 92 C43 108 45 124 56 126 C66 128 70 112 72 100 C74 88 79 80 88 72 Z" fill="#8b4a22" stroke="#2b1452" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- blush -->
  <ellipse cx="74" cy="128" rx="7" ry="4.5" fill="#ff86bd" opacity=".85"/>
  <ellipse cx="126" cy="128" rx="7" ry="4.5" fill="#ff5e9c" opacity=".7"/>

  <!-- eyes -->
  <circle cx="82" cy="108" r="8" fill="#2b1452"/>
  <circle cx="85" cy="105" r="2.6" fill="#fff"/>
  <ellipse cx="118" cy="108" rx="8" ry="9" fill="#3ed17a" stroke="#2b1452" stroke-width="3"/>
  <ellipse cx="118" cy="108.5" rx="2.2" ry="6.5" fill="#2b1452"/>
  <circle cx="120.5" cy="104" r="1.8" fill="#fff"/>

  <!-- nose, mouth, tongue -->
  <path d="M91 121 Q100 116 109 121 Q105 129 100 130 Q95 129 91 121 Z" fill="#2b1452"/>
  <path d="M90 137 Q90 148 96 147 Q101 146 99 137 Z" fill="#ff5e8e" stroke="#2b1452" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M100 130 Q99 137 91 137 M100 130 Q101 137 109 137" fill="none" stroke="#2b1452" stroke-width="3" stroke-linecap="round"/>

  <!-- whiskers (cat side) -->
  <g stroke="#2b1452" stroke-width="2.5" stroke-linecap="round">
    <line x1="128" y1="122" x2="156" y2="116"/>
    <line x1="128" y1="129" x2="158" y2="130"/>
  </g>

  <!-- sparkles -->
  <path d="M48 52 Q50 60 58 62 Q50 64 48 72 Q46 64 38 62 Q46 60 48 52 Z" fill="#fff" stroke="#2b1452" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156 136 Q157.5 142 163 143.5 Q157.5 145 156 151 Q154.5 145 149 143.5 Q154.5 142 156 136 Z" fill="#ffd23f" stroke="#2b1452" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
